name: Build and publish release

on:
  push:
    branches: ['master']

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: witness-linux-glibc
          # A glibc binary only runs on the glibc it was linked against or
          # newer, so older distributions get a build from an older runner.
          - runner: ubuntu-22.04
            artifact: witness-linux-glibc2.35
            max_glibc: '2.35'
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          rustup update stable
          rustup default stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.runner }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.runner }}-cargo-release-

      - name: Build release binary
        run: cargo build --release

      - name: Check required glibc version
        if: matrix.max_glibc
        env:
          MAX_GLIBC: ${{ matrix.max_glibc }}
        run: |
          required=$(objdump -T target/release/witness \
            | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -Vu | tail -1)
          echo "Binary requires glibc $required, limit is $MAX_GLIBC"
          [ "$(printf '%s\n' "$required" "$MAX_GLIBC" | sort -V | tail -1)" = "$MAX_GLIBC" ]

      - name: Package artifact
        run: |
          mkdir -p dist
          cp target/release/witness "dist/${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        run: cd dist && sha256sum witness-linux-* > sha256sums.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          {
            echo "Local shell recorder with a read-only REST API."
            echo ""
            echo "## Installation"
            echo ""
            echo '```bash'
            echo 'curl -fsSL https://github.com/nsg/witness/releases/latest/download/witness-linux-glibc -o ~/bin/witness'
            echo 'chmod +x ~/bin/witness'
            echo '```'
            echo ""
            echo "On older systems that fail with \`GLIBC_2.39' not found\`, such as"
            echo "Ubuntu 22.04, use \`witness-linux-glibc2.35\` instead."
            echo ""
            echo "## Recent Changes"
            echo ""
            echo '```'
            git log --oneline -20
            echo '```'
          } | gh release create latest --title "Latest" --notes-file - \
            dist/witness-linux-glibc dist/witness-linux-glibc2.35 dist/sha256sums.txt
